# This is a Klipper configuration for TronXY X5SA with CXY-V6 motherboard, compatible with CXY-V10.

# ===================== Basic Klipper Sections =====================
[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[virtual_sdcard]
path: ~/gcode_files

[display_status]

[pause_resume]

# ===================== Modifed Pause, Resume and Cancel =====================

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    M106 S0 # Turn off hotend fan
    SET_LED LED = hotend_led VALUE = 0 # Turn off hotend led

[gcode_macro FILAMENT_RUNOUT]
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=864000 # 10 days timeout
    {% set current_temp = printer.extruder.temperature %} # Save current nozzle temperature
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_nozzle_temp VALUE={current_temp} # Assign the saved temp to RESUME section
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0 # Hotend to 0°
    PAUSE

[gcode_macro PAUSE]
description: Pause the print and save the nozzle temperature
rename_existing: PAUSE_BASE
gcode:
    SET_IDLE_TIMEOUT TIMEOUT=864000 # 10 days timeout
    {% set current_temp = printer.extruder.temperature %} # Save current nozzle temperature
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_nozzle_temp VALUE={current_temp} # Assign the saved temp to RESUME section
    PAUSE_BASE  # Call the original PAUSE command
    G91 # Relative positioning
    G1 E-10 F2100 # Retract 10mm of filament
    G1 Z10 # Move Z up 10mm from current position
    G90 # Absolute positioning
    G1 X5 Y5 F6000 # Park at the coordinates you said you wanted
    
[gcode_macro RESUME]
description: Resume the print, restore last nozzle temperature, and wait until reached
rename_existing: RESUME_BASE
variable_last_nozzle_temp: 0
gcode:
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={last_nozzle_temp} # Set nozzle to last saved temperature
    RESUME_BASE # Resume the print once the temperature is reached

# ===================== Printer Config =====================

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 4500
max_accel_to_decel: 4500
square_corner_velocity: 5
max_z_velocity: 50
max_z_accel: 30

# ===================== Steppers =====================

[stepper_x]
step_pin: PE5
dir_pin: !PF1
enable_pin: !PF0
microsteps: 16
rotation_distance: 20
endstop_pin: !PC15
position_endstop: 0
position_min: 0
position_max: 500 # for bed mesh
homing_speed: 100
homing_retract_dist: 10
second_homing_speed: 10.0

[stepper_y]
step_pin: PF9
dir_pin: !PF3
enable_pin: !PF5
microsteps: 16
rotation_distance: 20
endstop_pin: !PC14
position_endstop: -2
position_min: -2
position_max: 500
homing_retract_dist: 10
homing_speed: 100
second_homing_speed: 10.0

[stepper_z]
step_pin: PA6
dir_pin: PF15
enable_pin: !PA5
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 500
position_min: -2

# ===================== Hotend =====================

[extruder]
step_pin: PB1
dir_pin: !PF13 #change to !PF13 for X5SA Pro Titan Extruder
enable_pin: !PF14
microsteps: 32
rotation_distance: 24.7258  #22.478# Titan Extruder Clone Rotation Distance
gear_ratio: 66:22 # Titan Extruder Clone Gear Ratio
nozzle_diameter: 0.800
filament_diameter: 1.750
heater_pin: PG7
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
control = pid
pid_kp = 23.292
pid_ki = 1.294
pid_kd = 104.812
min_temp: 0
max_temp: 250
min_extrude_temp: 170
max_extrude_only_distance: 300
pressure_advance: 0.35

# ===================== Bed =====================

[heater_bed]
heater_pin: PE2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC2
min_temp: 0
max_temp: 130
control = pid
pid_kp = 72.353
pid_ki = 1.227
pid_kd = 1066.301

[safe_z_home]
home_xy_position: 250, 250
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_screws]
screw1: 5, 5
screw2: 250, 5
screw3: 500, 5
screw4: 5, 500
screw5: 250, 500
screw6: 500, 500

[bed_mesh]
speed: 120
probe_count: 4, 4
horizontal_move_z: 5
algorithm: lagrange
mesh_min : 30, 30
mesh_max : 470, 440
mesh_pps: 0
fade_start: 1
fade_end: 10
fade_target: 0

# ===================== Fans, Pins and Filament Sensor =====================

[fan]
pin: PG0

[controller_fan drivers_fan]
pin: PD7

[heater_fan hotend_fan]
heater: extruder
heater_temp: 50.0
pin: PG9

[filament_switch_sensor filament_sensor]
pause_on_runout: False
runout_gcode: FILAMENT_RUNOUT
switch_pin: !PE6

[output_pin beeper]
pin: PA8

[output_pin hotend_led]
pin: PG10
value: 1

# ===================== Probe =====================

[probe]
x_offset: -30
y_offset: -10
pin: !PE3
speed: 30
z_offset = 2.12